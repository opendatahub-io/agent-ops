[project]
name = "red-compass"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "httpx>=0.28,<1",
  "anthropic>=0.50,<1", "pyjwt>=2.10,<3", "sentence-transformers>=3,<6",
  "pgvector>=0.3,<1", "pyyaml>=6,<7"
]

[project.optional-dependencies]
tracing = ["mlflow==3.17.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "openshell==0.1.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["red_compass*"]

[tool.setuptools.package-data]
red_compass = ["seed_data.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

