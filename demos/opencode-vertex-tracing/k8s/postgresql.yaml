apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: openshell
stringData:
  POSTGRESQL_USER: openshell
  POSTGRESQL_PASSWORD: openshell
  POSTGRESQL_DATABASE: openshell
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: openshell
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: openshell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: postgresql
        image: quay.io/mcampbel/pgvector:pg16
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: {name: postgresql-credentials, key: POSTGRESQL_USER}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgresql-credentials, key: POSTGRESQL_PASSWORD}
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef: {name: postgresql-credentials, key: POSTGRESQL_DATABASE}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: openshell
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
