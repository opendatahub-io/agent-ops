name: Wayfinder sync and deploy

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wayfinder/**'
      - '.github/workflows/wayfinder-pages.yml'

permissions: {}

concurrency:
  group: wayfinder-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh public status
        working-directory: wayfinder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py
      - name: Package site
        run: |
          mkdir -p _site/wayfinder/data
          BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed "s|href=\"styles\\.css\"|href=\"styles.css?v=$BUST\"|;s|src=\"app\\.js\"|src=\"app.js?v=$BUST\"|" wayfinder/index.html > _site/wayfinder/index.html
          cp wayfinder/styles.css wayfinder/app.js wayfinder/products.json _site/wayfinder/
          cp wayfinder/data/status.json _site/wayfinder/data/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Agent Ops</title>
          <h1>Agent Ops</h1>
          <p><a href="wayfinder/">Open AI Platform Wayfinder</a></p>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
